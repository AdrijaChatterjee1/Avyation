<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Avyation: My Claims</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Lora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#0f1a4a; --bg2:#1d2f7a; --bg3:#2b4a9a;
  --card:rgba(96,128,178,.38); --line:rgba(255,255,255,.22);
  --text:#fff; --muted:#c9d6f0; --accent:#b24dff; --accent2:#7fd0ff; --ok:#5ee6a8; --warn:#ffc857; --bad:#ff6b7a;
  --head:'Poppins',system-ui,sans-serif; --body:'Lora',Georgia,'Times New Roman',serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); color-scheme:dark;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#0b1438;--bg2:#17266a;--bg3:#243f8c}}
:root[data-theme="dark"]{--bg1:#0b1438;--bg2:#17266a;--bg3:#243f8c}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);color:var(--text);background:var(--bg1);line-height:1.55;overflow-x:hidden;min-height:100vh;
  background-image:radial-gradient(ellipse 60% 30% at 20% 12%,rgba(255,255,255,.14),transparent 70%),radial-gradient(ellipse 50% 25% at 80% 30%,rgba(255,255,255,.10),transparent 70%),linear-gradient(180deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em}
a{color:inherit;text-decoration:none}
.wrap{max-width:1160px;margin:0 auto;padding:0 22px}
header{position:sticky;top:0;z-index:20;background:rgba(11,20,56,.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:68px;position:relative}
.logo{font-family:var(--head);font-weight:800;font-size:1.35rem;letter-spacing:.06em;display:flex;align-items:center;gap:10px}
.logo svg{width:26px;height:26px}
.links{display:flex;gap:6px}
.links a{font-family:var(--head);font-weight:500;font-size:.9rem;padding:8px 14px;border-radius:999px;color:var(--muted);transition:.2s}
.links a:hover,.links a.on{background:var(--card);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--head);font-weight:600;font-size:.92rem;padding:12px 22px;border-radius:999px;border:0;cursor:pointer;transition:.2s;color:#fff}
.btn.pri{background:linear-gradient(135deg,var(--accent),#7b5cff);box-shadow:0 8px 24px rgba(178,77,255,.35)}
.btn.pri:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.ghost:hover{background:var(--card)}
.btn.sm{padding:8px 16px;font-size:.82rem}
.menu{display:none;background:none;border:0;color:#fff;font-size:1.6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:24px;backdrop-filter:blur(8px);box-shadow:0 10px 40px rgba(5,10,40,.3)}
.small{font-size:.88rem;color:var(--muted)}
.head{padding:48px 0 22px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.eyebrow{font-family:var(--head);font-weight:600;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2)}
.head h1{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:800;text-transform:uppercase;margin:10px 0 6px}
.head p{color:var(--muted);margin:0;font-size:1.08rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:26px}
.stat b{display:block;font-family:var(--head);font-size:1.9rem;font-weight:800;line-height:1.2}
.stat span{font-size:.88rem;color:var(--muted)}
.bar{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font-family:var(--head);font-weight:600;font-size:.82rem;border:1.5px solid var(--line);background:transparent;color:var(--muted);padding:8px 16px;border-radius:999px;cursor:pointer}
.tabs button.on{background:linear-gradient(135deg,var(--accent),#7b5cff);color:#fff;border-color:transparent}
.search{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(11,20,56,.55);color:#fff;font:inherit;font-size:.92rem;min-width:230px}
.search:focus{outline:2px solid var(--accent2);outline-offset:1px}
.list{display:grid;gap:14px;padding-bottom:50px}
.claim{padding:0;overflow:hidden}
.top{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr auto;gap:14px;align-items:center;padding:20px 24px;cursor:pointer}
.top:focus-visible{outline:2px solid var(--accent2);outline-offset:-2px}
.rt{font-family:var(--head);font-weight:800;font-size:1.2rem}
.pill{font-family:var(--head);font-size:.74rem;font-weight:600;padding:5px 12px;border-radius:999px;display:inline-block}
.pill.prog{background:rgba(255,200,87,.2);color:var(--warn)}
.pill.paid{background:rgba(94,230,168,.2);color:var(--ok)}
.pill.rej{background:rgba(255,107,122,.2);color:var(--bad)}
.amt{font-family:var(--head);font-weight:700;font-size:1.1rem}
.chev{font-size:1.1rem;color:var(--muted);transition:.25s}
.claim.open .chev{transform:rotate(180deg)}
.more{display:none;border-top:1px solid var(--line);padding:22px 24px;grid-template-columns:1fr 1fr;gap:28px}
.claim.open .more{display:grid}
.more h3{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:.93rem}
.kv span{color:var(--muted)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.tl li{display:flex;gap:12px;font-size:.92rem}
.tl .d{width:12px;height:12px;border-radius:50%;background:var(--ok);margin-top:6px;flex:none}
.tl li.next .d{background:rgba(255,255,255,.3)}
.tl li.bad .d{background:var(--bad)}
.act{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
.empty{text-align:center;padding:50px 20px;display:none}
.empty h3{margin-bottom:6px}
footer{padding:26px 0 40px;text-align:center;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}
@media(max-width:900px){
  .stats{grid-template-columns:1fr 1fr}
  .top{grid-template-columns:1fr 1fr;gap:10px}
  .top .chev{display:none}
  .more{grid-template-columns:1fr}
  .search{min-width:0;width:100%}
  .links{display:none;position:absolute;top:68px;left:0;right:0;flex-direction:column;background:rgba(11,20,56,.96);padding:12px;border-bottom:1px solid var(--line)}
  .links.open{display:flex}.menu{display:block}.hide-m{display:none}
}
</style>
<link rel="stylesheet" href="responsive.css">
</head>
<body>
<header><div class="wrap"><nav>
  <a class="logo" href="dashboard.html"><svg viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>AVYATION</a>
  <div class="links" id="links">
    <a href="dashboard.html">Dashboard</a><a href="upload_ticket.html">Upload Ticket</a><a href="claim.html">File a Claim</a><a class="on" href="my_claims.html">My Claims</a><a href="working.html">How it works</a>
  </div>
  <a class="btn pri hide-m" href="upload_ticket.html" style="padding:10px 20px">New claim</a>
  <button class="menu" id="menu" aria-label="Menu">☰</button>
</nav></div></header>

<main class="wrap">
  <div class="head">
    <div><div class="eyebrow">My claims</div><h1>Your claims</h1><p>Track every claim from filing to payout.</p></div>
    <a class="btn pri" href="upload_ticket.html">+ New claim</a>
  </div>

  <div class="stats" id="stats"></div>

  <div class="bar">
    <div class="tabs" id="tabs">
      <button class="on" data-f="all">All</button><button data-f="prog">In progress</button><button data-f="paid">Paid</button><button data-f="rej">Rejected</button>
    </div>
    <input class="search" id="q" placeholder="Search flight, route or case ID" aria-label="Search claims">
  </div>

  <div class="list" id="list"></div>
  <div class="card empty" id="empty"><h3>No claims found</h3><div class="small">Try a different filter, or start a new claim.</div></div>
</main>
<footer><div class="wrap">Avyation · Sample data shown · Powered by TinyFish live-web agents</div></footer>

<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  $('menu').onclick=function(){$('links').classList.toggle('open')};

  // Sample data. TODO: replace with GET /api/claims
  // var C=[
  //  {id:'IND-48213',air:'IndiGo',fno:'6E-204',from:'DEL',to:'BLR',date:'19 Oct 2026',issue:'4h 10m delay',amt:'₹10,000',n:10000,cur:'₹',st:'prog',rule:'DGCA CAR Section 3',pnr:'W4K9LM',
  //   tl:[['Notice filed on airline portal','19 Oct, 18:42',1],['Airline acknowledged','20 Oct, 09:10',1],['Awaiting airline decision','Usually 7 to 14 days',0]]},
  //  {id:'AIR-77102',air:'Air India',fno:'AI-101',from:'DEL',to:'LHR',date:'02 Sep 2026',issue:'Cancelled',amt:'€600',n:600,cur:'€',st:'paid',rule:'EU261',pnr:'K2M8QP',
  //   tl:[['Notice filed on airline portal','02 Sep, 21:15',1],['Airline accepted claim','14 Sep, 11:30',1],['Payout received (UPI)','18 Sep, 16:05',1]]},
  //  {id:'SPI-30955',air:'SpiceJet',fno:'SG-955',from:'BOM',to:'DEL',date:'11 Aug 2026',issue:'2h delay',amt:'Meals',n:0,cur:'',st:'rej',rule:'DGCA CAR Section 3',pnr:'R7T3XD',
  //   tl:[['Notice filed on airline portal','11 Aug, 20:02',1],['Airline rejected: cited weather',' 25 Aug, 10:44',2],['Appeal available','Weather claim contradicted by departure data',0]]},
  //  {id:'AFR-55820',air:'Air France',fno:'AF-225',from:'DEL',to:'CDG',date:'28 Jul 2026',issue:'3h 30m delay',amt:'€600',n:600,cur:'€',st:'prog',rule:'EU261',pnr:'B9L5NC',
  //   tl:[['Notice filed on airline portal','28 Jul, 23:50',1],['Airline requested documents','05 Aug, 08:20',1],['Documents sent, awaiting decision','06 Aug, 12:00',0]]}
  // ];
  var C = [];
  var lbl={prog:'In progress',paid:'Paid',rej:'Rejected'},filt='all',term='';
  
  async function loadClaims() {
    $('list').innerHTML =
      '<div class="card" style="padding:24px">Loading claims from the backend…</div>';

    try {
      var response = await fetch('http://127.0.0.1:8000/api/claims');

      if (!response.ok) {
        throw new Error('API returned HTTP ' + response.status);
      }

      var records = await response.json();

      C = records.map(function (item) {
        var routeParts = (item.route || 'Unknown → Unknown').split('→');
        var statusText = (item.status || '').toLowerCase();

        var status = statusText.indexOf('paid') !== -1
          ? 'paid'
          : statusText.indexOf('reject') !== -1
            ? 'rej'
            : 'prog';

        var tracking = item.tracking_reference || '';

        return {
          id: item.id,
          air: item.flight || 'Unknown airline',
          fno: item.flight || 'Unknown flight',
          from: (routeParts[0] || '').trim(),
          to: (routeParts[1] || '').trim(),
          date: 'Date not provided',
          issue: item.issue || 'Not specified',
          amt: item.amount || 'Not specified',
          n: 0,
          cur: '',
          st: status,
          rule: 'Not provided by the claims API',
          pnr: 'Not provided',
          tl: [[
            'Backend status: ' + (item.status || 'Unknown'),
            tracking ? 'Reference: ' + tracking : 'No tracking reference provided',
            1
          ]]
        };
      });

      stats();
      render();

      if (C.length === 0) {
        $('empty').style.display = 'block';
      }
    } catch (error) {
      $('list').innerHTML =
        '<div class="card" style="padding:24px">' +
        '<b>Could not load claims.</b><p>' +
        error.message +
        '</p><p>Check that the FastAPI backend is running on port 8000.</p></div>';

      $('stats').innerHTML = '';
      console.error('Claims API error:', error);
    }
  }


  function stats(){
    var rec=0;C.forEach(function(c){if(c.st==='paid')rec+=c.n});
    var items=[[C.length,'Total claims'],[C.filter(function(c){return c.st==='prog'}).length,'In progress'],['€'+rec.toLocaleString(),'Recovered so far'],[C.filter(function(c){return c.st==='paid'}).length,'Paid out']];
    $('stats').innerHTML=items.map(function(s){return '<div class="card stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>'}).join('');
  }
  function row(c,i){
    return '<div class="card claim" id="c'+i+'">'+
    '<div class="top" tabindex="0" role="button" aria-expanded="false" data-i="'+i+'">'+
      '<div><div class="rt">'+c.from+' → '+c.to+'</div><div class="small">'+c.air+' '+c.fno+' · '+c.date+'</div></div>'+
      '<div><div class="small">Issue</div>'+c.issue+'</div>'+
      '<div><div class="small">Claimed</div><div class="amt">'+c.amt+'</div></div>'+
      '<div><span class="pill '+c.st+'">'+lbl[c.st]+'</span></div>'+
      '<div class="chev">▾</div></div>'+
    '<div class="more"><div><h3>Details</h3><div class="kv"><span>Case ID</span><b>'+c.id+'</b><span>PNR</span><b>'+c.pnr+'</b><span>Rule</span><b>'+c.rule+'</b><span>Airline</span><b>'+c.air+'</b></div></div>'+
    '<div><h3>Timeline</h3><ul class="tl">'+c.tl.map(function(t){return '<li class="'+(t[2]===1?'':t[2]===2?'bad':'next')+'"><span class="d"></span><div><b>'+t[0]+'</b><div class="small">'+t[1]+'</div></div></li>'}).join('')+'</ul></div>'+
    '<div class="act">'+(c.st==='rej'?'<a class="btn pri sm" href="claim.html?air='+encodeURIComponent(c.air)+'&fno='+c.fno+'&from='+c.from+'&to='+c.to+'&pnr='+c.pnr+'">Appeal this decision</a>':'')+
    '<button class="btn ghost sm" data-copy="'+c.id+'">Copy case ID</button></div></div></div>';
  }
  function render(){
    var l=C.filter(function(c){
      var t=(c.id+c.air+c.fno+c.from+c.to).toLowerCase();
      return (filt==='all'||c.st===filt)&&t.indexOf(term)>-1});
    $('list').innerHTML=l.map(function(c){return row(c,C.indexOf(c))}).join('');
    $('empty').style.display=l.length?'none':'block';
  }
  $('list').addEventListener('click',function(e){
    var cp=e.target.closest('[data-copy]');
    if(cp){try{navigator.clipboard.writeText(cp.dataset.copy)}catch(x){}cp.textContent='Copied ✓';setTimeout(function(){cp.textContent='Copy case ID'},1400);return}
    var t=e.target.closest('.top');if(t){var c=t.parentNode;c.classList.toggle('open');t.setAttribute('aria-expanded',c.classList.contains('open'))}
  });
  $('list').addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('top')){e.preventDefault();e.target.click()}});
  $('tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
    document.querySelectorAll('#tabs button').forEach(function(x){x.classList.remove('on')});b.classList.add('on');filt=b.dataset.f;render()});
  $('q').oninput=function(){term=this.value.trim().toLowerCase();render()};
  loadClaims();
})();
</script>
</body>
</html>
